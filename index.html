<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <meta name="description" content="Gülpınar Derneği Bilgi ve Yönetim Sistemi uygulama kısayolu">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <title>Gülpınar Derneği</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;
    padding:24px;background:linear-gradient(145deg,#f0fdf4,#e2e8f0);font-family:Arial,sans-serif;color:#172554}
    main{width:min(100%,460px);background:#fff;border-radius:24px;padding:34px 28px;text-align:center;
    box-shadow:0 18px 55px #0f172a18}
    .logo{width:92px;height:92px;object-fit:contain;border-radius:22px}
    h1{font-size:24px;margin:18px 0 8px;color:#14532d}
    p{line-height:1.55;color:#475569}
    button,a.action{display:block;width:100%;border:0;border-radius:12px;padding:15px 18px;
    font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;margin-top:14px}
    .primary{background:#14532d;color:white}.secondary{background:#ecfdf5;color:#14532d}
    #install{display:none}.note{font-size:12px;margin-top:22px;color:#64748b}
  </style>
</head>
<body>
<main>
  <img class="logo" src="./icon-192.png" alt="Gülpınar Derneği simgesi">
  <h1>GÜLPINAR DERNEĞİ</h1>
  <p>Bilgi ve Yönetim Sistemi</p>
  <a class="action primary" href="https://gulpinarmahallesidernegi.blogspot.com/" target="_blank" rel="noopener">
    Yönetim Sistemini Aç
  </a>
  <button id="install" class="secondary" type="button">Uygulamayı Yükle</button>
  <p class="note">Bu uygulama mevcut Blogger sisteminden bağımsızdır. Üye, aidat ve yönetim verileri bu pakette tutulmaz; mevcut sisteminiz açılır.</p>
</main>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
  }
  let installPrompt;
  const installButton = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    installPrompt = event;
    installButton.style.display = "block";
  });
  installButton.addEventListener("click", async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installButton.style.display = "none";
  });
</script>
</body>
</html>
